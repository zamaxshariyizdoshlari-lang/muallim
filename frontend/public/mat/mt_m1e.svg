<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Nisbat va foiz" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Nisbat va foiz</text><text x="360.0" y="60.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Nisbat va foiz</text><rect x="60.0" y="100.0" width="600.0" height="40.0" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/><rect x="60.0" y="100.0" width="150.0" height="40.0" rx="6" fill="#60a5fa" stroke="none" stroke-width="1"/><text x="135.0" y="126.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">25%</text><text x="360.0" y="126.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">100% = butun</text><text x="360.0" y="190.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">200 ning 25% i = 200 · 0,25 = 50</text><text x="360.0" y="235.0" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Proporsiya: a : b = c : d  ⇒  a·d = b·c</text><text x="360.0" y="285.0" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Misol: 3 : 5 = 12 : x  ⇒  x = 20</text></svg>