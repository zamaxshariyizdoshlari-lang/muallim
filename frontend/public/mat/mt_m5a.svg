<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Perpendikulyarlik" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Perpendikulyarlik</text><text x="360.0" y="56.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Fazoda to'g'ri chiziq va tekislik</text><path d="M120.0 300.0 L480.0 300.0 L560.0 210.0 L200.0 210.0Z" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5" stroke-linejoin="round"/><line x1="340.0" y1="255.0" x2="340.0" y2="90.0" stroke="#ef4444" stroke-width="3"/><path d="M340.0 90.0 L345.4 101.3 L334.6 101.3Z" fill="#ef4444"/><circle cx="340.0" cy="255.0" r="5" fill="#ef4444" stroke="none" stroke-width="1"/><text x="360.0" y="120.0" text-anchor="start" font-size="15" font-weight="700" fill="#ef4444">a ⟂ α</text><text x="500.0" y="320.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">α — tekislik</text><text x="360.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Chiziq tekislikdagi ikki kesishuvchi chiziqqa perpendikulyar bo'lsa, tekislikka perpendikulyar</text></svg>