<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Pifagor teoremasi" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Pifagor teoremasi</text><text x="360.0" y="56.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Pifagor teoremasi: a² + b² = c²</text><path d="M260.0 300.0 L260.0 180.0 L400.0 300.0Z" fill="#fef3c7" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/><rect x="260.0" y="288.0" width="12.0" height="12.0" rx="0" fill="none" stroke="#78350f" stroke-width="2"/><rect x="140.0" y="180.0" width="120.0" height="120.0" rx="0" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/><text x="200.0" y="245.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">a²</text><rect x="260.0" y="300.0" width="140.0" height="100.0" rx="0" fill="#bbf7d0" stroke="#14532d" stroke-width="2"/><text x="330.0" y="358.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">b²</text><path d="M260.0 180.0 L400.0 300.0 L480.0 200.0 L340.0 80.0Z" fill="#fecaca" stroke="#7f1d1d" stroke-width="2" stroke-linejoin="round"/><text x="380.0" y="190.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">c²</text><text x="500.0" y="320.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">3² + 4² = 5²</text></svg>