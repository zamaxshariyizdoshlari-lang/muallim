<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Uchburchakni yechish" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Uchburchakni yechish</text><text x="360.0" y="56.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Sinuslar teoremasi</text><path d="M120.0 320.0 L560.0 320.0 L390.0 120.0Z" fill="#e0f2fe" stroke="#0c4a6e" stroke-width="2.5" stroke-linejoin="round"/><text x="105.0" y="340.0" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2937">A</text><text x="580.0" y="340.0" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2937">B</text><text x="390.0" y="108.0" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2937">C</text><text x="340.0" y="345.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">c</text><text x="500.0" y="215.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">a</text><text x="235.0" y="215.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">b</text><text x="360.0" y="385.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">a/sin A = b/sin B = c/sin C = 2R;   c² = a² + b² − 2ab·cos C</text></svg>