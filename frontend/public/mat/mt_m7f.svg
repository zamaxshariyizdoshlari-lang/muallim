<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Eyler–Venn diagrammasi" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Eyler–Venn diagrammasi</text><text x="360.0" y="56.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">To'plamlar: A ∪ B, A ∩ B</text><circle cx="290" cy="215" r="120" fill="#60a5fa" fill-opacity=".35" stroke="#1e3a8a" stroke-width="2.5"/><circle cx="430" cy="215" r="120" fill="#f87171" fill-opacity=".35" stroke="#7f1d1d" stroke-width="2.5"/><text x="230.0" y="220.0" text-anchor="middle" font-size="24" font-weight="800" fill="#1f2937">A</text><text x="490.0" y="220.0" text-anchor="middle" font-size="24" font-weight="800" fill="#1f2937">B</text><text x="360.0" y="220.0" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2937">A ∩ B</text><text x="360.0" y="380.0" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Qo'shish qoidasi: |A ∪ B| = |A| + |B| − |A ∩ B|</text></svg>