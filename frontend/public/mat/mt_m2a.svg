<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Yuza orqali isbot" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Yuza orqali isbot</text><text x="360.0" y="56.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">(a + b)² = a² + 2ab + b²</text><rect x="160.0" y="90.0" width="200.0" height="200.0" rx="0" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/><rect x="360.0" y="90.0" width="120.0" height="200.0" rx="0" fill="#fde68a" stroke="#78350f" stroke-width="2"/><rect x="160.0" y="290.0" width="200.0" height="80.0" rx="0" fill="#fde68a" stroke="#78350f" stroke-width="2"/><rect x="360.0" y="290.0" width="120.0" height="80.0" rx="0" fill="#bbf7d0" stroke="#14532d" stroke-width="2"/><text x="260.0" y="195.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2937">a²</text><text x="420.0" y="195.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">ab</text><text x="260.0" y="337.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">ab</text><text x="420.0" y="337.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">b²</text><text x="260.0" y="82.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">a</text><text x="420.0" y="82.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">b</text></svg>