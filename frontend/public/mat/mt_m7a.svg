<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Arifmetik progressiya" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Arifmetik progressiya</text><text x="360.0" y="56.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Arifmetik progressiya: aₙ = a₁ + (n−1)d</text><rect x="80.0" y="290.0" width="70.0" height="50.0" rx="6" fill="#bfdbfd" stroke="#60a5fa" stroke-width="2"/><text x="115.0" y="280.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">3</text><text x="115.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a1</text><rect x="175.0" y="250.0" width="70.0" height="90.0" rx="6" fill="#adedd6" stroke="#34d399" stroke-width="2"/><text x="210.0" y="240.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">5</text><text x="210.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a2</text><rect x="270.0" y="210.0" width="70.0" height="130.0" rx="6" fill="#fde5a7" stroke="#fbbf24" stroke-width="2"/><text x="305.0" y="200.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">7</text><text x="305.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a3</text><rect x="365.0" y="170.0" width="70.0" height="170.0" rx="6" fill="#fcc6c6" stroke="#f87171" stroke-width="2"/><text x="400.0" y="160.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">9</text><text x="400.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a4</text><rect x="460.0" y="130.0" width="70.0" height="210.0" rx="6" fill="#dbd0fd" stroke="#a78bfa" stroke-width="2"/><text x="495.0" y="120.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">11</text><text x="495.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a5</text><rect x="555.0" y="90.0" width="70.0" height="250.0" rx="6" fill="#fdd3b1" stroke="#fb923c" stroke-width="2"/><text x="590.0" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">13</text><text x="590.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a6</text><text x="360.0" y="385.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">a₁ = 3,  d = 2  →  3, 5, 7, 9, 11, 13</text></svg>