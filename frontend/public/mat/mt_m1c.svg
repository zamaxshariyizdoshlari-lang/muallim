<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Oddiy kasrlar" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Oddiy kasrlar</text><text x="360.0" y="60.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">3/4 kasrni tasvirlash</text><rect x="120.0" y="120.0" width="120.0" height="80.0" rx="0" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><rect x="240.0" y="120.0" width="120.0" height="80.0" rx="0" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><rect x="360.0" y="120.0" width="120.0" height="80.0" rx="0" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><rect x="480.0" y="120.0" width="120.0" height="80.0" rx="0" fill="#f1f5f9" stroke="#1e3a8a" stroke-width="2"/><text x="360.0" y="240.0" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">3/4 = 4 qismdan 3 tasi</text><text x="360.0" y="290.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">3/4 = 6/8 = 9/12  (kasrning asosiy xossasi)</text><text x="360.0" y="335.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Qo'shish: 1/4 + 2/4 = 3/4 (maxraj o'zgarmaydi)</text></svg>