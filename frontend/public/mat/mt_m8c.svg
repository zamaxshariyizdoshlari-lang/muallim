<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Ellips, giperbola, parabola" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Ellips, giperbola, parabola</text><text x="360.0" y="56.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Konik kesimlar</text><ellipse cx="130" cy="190" rx="90" ry="55" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="130.0" y="290.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Ellips</text><text x="130.0" y="315.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">x²/a² + y²/b² = 1</text><path d="M300 90 Q380 190 300 290" fill="none" stroke="#7f1d1d" stroke-width="3"/><path d="M420 90 Q340 190 420 290" fill="none" stroke="#7f1d1d" stroke-width="3"/><text x="360.0" y="335.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Giperbola</text><text x="360.0" y="360.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">x²/a² − y²/b² = 1</text><path d="M520 90 Q580 320 640 90" fill="none" stroke="#14532d" stroke-width="3"/><text x="580.0" y="335.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Parabola</text><text x="580.0" y="360.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">y² = 2px</text></svg>