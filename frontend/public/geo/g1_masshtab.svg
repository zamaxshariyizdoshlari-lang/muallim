<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Xarita masshtabi" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Xarita masshtabi</text><text x="360.0" y="80.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">1 : 100 000 masshtab — xaritada 1 sm yerda 1 km</text><rect x="100.0" y="120.0" width="80.0" height="18.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="100.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">0</text><rect x="180.0" y="120.0" width="80.0" height="18.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="180.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">1</text><rect x="260.0" y="120.0" width="80.0" height="18.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="260.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">2</text><rect x="340.0" y="120.0" width="80.0" height="18.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="340.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">3</text><rect x="420.0" y="120.0" width="80.0" height="18.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="420.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">4</text><rect x="500.0" y="120.0" width="80.0" height="18.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="500.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">5</text><text x="580.0" y="160.0" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">5 km</text><text x="360.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Chiziqli masshtab: kesma bo'laklari yerdagi masofani ko'rsatadi</text><rect x="100.0" y="207.0" width="520.0" height="28.0" rx="6" fill="#60a5fa33" stroke="none" stroke-width="1"/><text x="120.0" y="225.0" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">1 : 10 000</text><text x="300.0" y="225.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">1 sm = 100 m</text><text x="460.0" y="225.0" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">Eng yirik (reja)</text><rect x="100.0" y="239.0" width="520.0" height="28.0" rx="6" fill="#34d39933" stroke="none" stroke-width="1"/><text x="120.0" y="257.0" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">1 : 100 000</text><text x="300.0" y="257.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">1 sm = 1 km</text><text x="460.0" y="257.0" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">Yirik</text><rect x="100.0" y="271.0" width="520.0" height="28.0" rx="6" fill="#fbbf2433" stroke="none" stroke-width="1"/><text x="120.0" y="289.0" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">1 : 1 000 000</text><text x="300.0" y="289.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">1 sm = 10 km</text><text x="460.0" y="289.0" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">O'rta</text><rect x="100.0" y="303.0" width="520.0" height="28.0" rx="6" fill="#f8717133" stroke="none" stroke-width="1"/><text x="120.0" y="321.0" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">1 : 50 000 000</text><text x="300.0" y="321.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">1 sm = 500 km</text><text x="460.0" y="321.0" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">Mayda (dunyo xaritasi)</text></svg>