<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Tuproq profili (gorizontlar)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Tuproq profili (gorizontlar)</text><rect x="40.0" y="50.0" width="320.0" height="36.0" rx="4" fill="#78350f" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="73.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">O — to'shama</text><text x="375.0" y="73.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">o'simlik qoldiqlari</text><rect x="40.0" y="86.0" width="320.0" height="72.0" rx="4" fill="#451a03" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">A — gumusli gorizont</text><text x="375.0" y="127.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">unumdor, qora/to'q rangli</text><rect x="40.0" y="158.0" width="320.0" height="72.0" rx="4" fill="#a16207" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="199.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">B — to'planish</text><text x="375.0" y="199.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">suv bilan yuvilgan moddalar</text><rect x="40.0" y="230.0" width="320.0" height="72.0" rx="4" fill="#d6b88a" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="271.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">C — ona jins</text><text x="375.0" y="271.0" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">mayda jins bo'laklari</text><rect x="40.0" y="302.0" width="320.0" height="63.0" rx="4" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="338.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">R — tog' jinsi</text><text x="375.0" y="338.5" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">qattiq jins</text><text x="360.0" y="386.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Tuproq qatlami juda yupqa (1–2 m), ammo hayot uchun asos</text></svg>