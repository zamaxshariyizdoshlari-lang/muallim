<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Tabiat zonalari (shimoliy yarimshar, tekisliklarda)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Tabiat zonalari (shimoliy yarimshar, tekisliklarda)</text><rect x="110.0" y="50.0" width="570.0" height="33.3" rx="2" fill="#e0f2fe" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="70.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Arktika cho'li</text><text x="395.0" y="85.7" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">muz va qor, kam o'simlik</text><rect x="110.0" y="83.3" width="570.0" height="13.3" rx="2" fill="#bfdbfe" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="94.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Tundra</text><text x="395.0" y="109.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">moxlar, lishayniklar, bodom</text><rect x="110.0" y="96.7" width="570.0" height="16.7" rx="2" fill="#86efac" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="109.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Tayga</text><text x="395.0" y="124.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">ignabargli o'rmon</text><rect x="110.0" y="113.3" width="570.0" height="11.7" rx="2" fill="#4ade80" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="123.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Aralash va keng bargli o'rmon</text><text x="395.0" y="138.2" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">emen, qayin, qarag'ay</text><rect x="110.0" y="125.0" width="570.0" height="8.3" rx="2" fill="#fde68a" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="133.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Dasht</text><text x="395.0" y="148.2" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">o'tlar, qora tuproq</text><rect x="110.0" y="133.3" width="570.0" height="25.0" rx="2" fill="#fdba74" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="149.8" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Cho'l va yarim cho'l</text><text x="395.0" y="164.8" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">saksovul, yantoq</text><rect x="110.0" y="158.3" width="570.0" height="28.3" rx="2" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="176.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Savanna</text><text x="395.0" y="191.5" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">baland o'tlar, daraxt-butalar</text><rect x="110.0" y="186.7" width="570.0" height="13.3" rx="2" fill="#22c55e" stroke="#fff" stroke-width="1.5"/><text x="395.0" y="197.3" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Nam ekvatorial o'rmon</text><text x="395.0" y="212.3" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">ko'p qavatli, doim yashil</text><line x1="102.0" y1="50.0" x2="110.0" y2="50.0" stroke="#475569" stroke-width="2"/><text x="98.0" y="54.0" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">90°</text><line x1="102.0" y1="89.2" x2="110.0" y2="89.2" stroke="#475569" stroke-width="2"/><text x="98.0" y="93.2" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">66.5° Sh</text><line x1="102.0" y1="160.8" x2="110.0" y2="160.8" stroke="#475569" stroke-width="2"/><text x="98.0" y="164.8" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">23.5° Sh</text><line x1="102.0" y1="200.0" x2="110.0" y2="200.0" stroke="#475569" stroke-width="2"/><text x="98.0" y="204.0" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">0°</text><line x1="102.0" y1="239.2" x2="110.0" y2="239.2" stroke="#475569" stroke-width="2"/><text x="98.0" y="243.2" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">23.5° J</text><line x1="102.0" y1="310.8" x2="110.0" y2="310.8" stroke="#475569" stroke-width="2"/><text x="98.0" y="314.8" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">66.5° J</text><line x1="102.0" y1="350.0" x2="110.0" y2="350.0" stroke="#475569" stroke-width="2"/><text x="98.0" y="354.0" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">90°</text><text x="360.0" y="388.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Zonalar kenglik bo'yicha o'zgaradi (iqlim va tuproq bilan birga)</text></svg>