<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Ekologik energiya piramidasi" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Ekologik energiya piramidasi</text><rect x="40.0" y="50.0" width="320.0" height="43.8" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="76.9" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">3-tartib iste'molchi</text><text x="375.0" y="76.9" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">0,1 % energiya (burgut, bo'ri)</text><rect x="40.0" y="93.8" width="320.0" height="61.2" rx="4" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="129.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">2-tartib iste'molchi</text><text x="375.0" y="129.4" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">1 % energiya (yirtqichlar)</text><rect x="40.0" y="155.0" width="320.0" height="78.8" rx="4" fill="#84cc16" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="199.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">1-tartib iste'molchi</text><text x="375.0" y="199.4" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">10 % energiya (o'txo'rlar)</text><rect x="40.0" y="233.8" width="320.0" height="131.2" rx="4" fill="#22c55e" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="304.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Ishlab chiqaruvchilar</text><text x="375.0" y="304.4" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">100 % energiya (o'simliklar)</text></svg>