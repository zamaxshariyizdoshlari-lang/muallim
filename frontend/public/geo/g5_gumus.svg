<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Tuproqdagi gumus miqdori" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Tuproqdagi gumus miqdori</text><text x="190.0" y="95.9" text-anchor="end" font-size="13" font-weight="400" fill="#1f2937">Qora tuproq (chernozem)</text><rect x="200.0" y="59.0" width="420.0" height="63.8" rx="4" fill="#60a5fa" stroke="none" stroke-width="1"/><text x="628.0" y="95.9" text-anchor="start" font-size="12" font-weight="700" fill="#1f2937">10 %</text><text x="190.0" y="169.6" text-anchor="end" font-size="13" font-weight="400" fill="#1f2937">Kashtan tuproq</text><rect x="200.0" y="132.8" width="168.0" height="63.8" rx="4" fill="#34d399" stroke="none" stroke-width="1"/><text x="376.0" y="169.6" text-anchor="start" font-size="12" font-weight="700" fill="#1f2937">4 %</text><text x="190.0" y="243.4" text-anchor="end" font-size="13" font-weight="400" fill="#1f2937">Bo'z tuproq (O'zbekiston)</text><rect x="200.0" y="206.5" width="63.0" height="63.8" rx="4" fill="#fbbf24" stroke="none" stroke-width="1"/><text x="271.0" y="243.4" text-anchor="start" font-size="12" font-weight="700" fill="#1f2937">1.5 %</text><text x="190.0" y="317.1" text-anchor="end" font-size="13" font-weight="400" fill="#1f2937">Sahro (qumli) tuproq</text><rect x="200.0" y="280.2" width="21.0" height="63.8" rx="4" fill="#f87171" stroke="none" stroke-width="1"/><text x="229.0" y="317.1" text-anchor="start" font-size="12" font-weight="700" fill="#1f2937">0.5 %</text><text x="360.0" y="386.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Gumus qancha ko'p bo'lsa, tuproq shuncha unumdor</text></svg>