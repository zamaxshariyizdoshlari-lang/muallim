<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Yerning ichki tuzilishi" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Yerning ichki tuzilishi</text><rect x="40.0" y="50.0" width="320.0" height="22.2" rx="4" fill="#c4a574" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="66.1" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Yer po'sti</text><text x="375.0" y="66.1" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">5–70 km, qattiq tog' jinslari (materik va okean)</text><rect x="40.0" y="72.2" width="320.0" height="133.1" rx="4" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="143.7" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Mantiya</text><text x="375.0" y="143.7" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">~2900 km, qizigan yarim plastik massa</text><rect x="40.0" y="205.3" width="320.0" height="97.6" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="259.1" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Tashqi yadro</text><text x="375.0" y="259.1" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">~2200 km, suyuq temir-nikel (4000–5000 °C)</text><rect x="40.0" y="302.9" width="320.0" height="62.1" rx="4" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="338.9" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Ichki yadro</text><text x="375.0" y="338.9" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">~1200 km radiusli, qattiq (taxminan 5400 °C)</text><text x="360.0" y="386.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Chuqurlik oshgani sari harorat va bosim ortadi (Yer markazida ~6371 km)</text></svg>