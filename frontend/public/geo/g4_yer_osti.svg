<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Yer osti suvlari qatlamlari" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Yer osti suvlari qatlamlari</text><rect x="40.0" y="50.0" width="320.0" height="66.8" rx="4" fill="#a16207" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="88.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Tuproq va havo oqimi</text><text x="375.0" y="88.4" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">yuqori qatlam</text><rect x="40.0" y="116.8" width="320.0" height="66.8" rx="4" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="155.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Grunt suvi</text><text x="375.0" y="155.2" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">birinchi suv o'tkazmas qatlamgacha (quduqlar)</text><rect x="40.0" y="183.6" width="320.0" height="57.3" rx="4" fill="#92400e" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="217.3" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Suv o'tkazmas qatlam (gil)</text><text x="375.0" y="217.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">suvni o'tkazmaydi</text><rect x="40.0" y="240.9" width="320.0" height="66.8" rx="4" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="279.3" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Artezian suvi</text><text x="375.0" y="279.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">ikki gil orasida, bosim ostida</text><rect x="40.0" y="307.7" width="320.0" height="57.3" rx="4" fill="#78350f" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="341.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Suv o'tkazmas qatlam</text><text x="375.0" y="341.4" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">pastki to'siq</text></svg>