<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Atmosfera qatlamlari" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="14" fill="#f8fafc"/><text x="360.0" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Atmosfera qatlamlari</text><rect x="40.0" y="50.0" width="320.0" height="38.4" rx="4" fill="#1e293b" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="74.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Ekzosfera</text><text x="375.0" y="74.2" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">800 km dan yuqori, havo juda siyrak</text><rect x="40.0" y="88.4" width="320.0" height="53.8" rx="4" fill="#4338ca" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="120.3" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Termosfera</text><text x="375.0" y="120.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">85–800 km, shimol yog'dulari, yo'ldoshlar</text><rect x="40.0" y="142.2" width="320.0" height="46.1" rx="4" fill="#6366f1" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="170.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Mezosfera</text><text x="375.0" y="170.2" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">50–85 km, meteorlar yonadi (−90 °C)</text><rect x="40.0" y="188.3" width="320.0" height="84.5" rx="4" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="235.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Stratosfera</text><text x="375.0" y="235.5" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">12–50 km, ozon qatlami (20–25 km)</text><rect x="40.0" y="272.8" width="320.0" height="92.2" rx="4" fill="#bae6fd" stroke="#ffffff" stroke-width="2"/><text x="200.0" y="323.9" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Troposfera</text><text x="375.0" y="323.9" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">0–12 km, ob-havo shu yerda (havoning 80 %)</text><text x="360.0" y="386.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Troposferada balandlik oshgani sari harorat har 1 km da ~6 °C pasayadi</text></svg>