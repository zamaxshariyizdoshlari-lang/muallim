name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: cp .env.example .env
      - run: python manage.py test history_ai -v 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  content-validate:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: cp .env.example .env
      - name: Validate all content/*/book.json files against the import schema
        run: |
          python manage.py shell -c "
          import glob, json, sys
          from history_ai.services.book_import import validate_book_json
          failed = False
          for path in sorted(glob.glob('content/*/book.json')):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              errors = validate_book_json(data)
              if errors:
                  failed = True
                  print(f'{path}: {len(errors)} xato')
                  for e in errors[:20]:
                      print(' -', e)
              else:
                  print(f'{path}: OK')
          sys.exit(1 if failed else 0)
          "
