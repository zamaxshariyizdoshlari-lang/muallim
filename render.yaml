# ESLATMA: bu Render bepul Postgres'i endi ishlatilmaydi - baza Supabase'ga ko'chirildi (pastdagi
# muallim-api xizmatining DB_HOST/DB_USER/DB_PASSWORD qarang). Bu blok shunchaki eski, ishlatilmayotgan
# resurs sifatida qolgan - tekshirib bo'lgach Render Dashboard'dan qo'lda o'chirsangiz bo'ladi.
databases:
  - name: muallim-db
    plan: free
    databaseName: muallim
    user: muallim

services:
  - type: web
    name: muallim-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      (python manage.py createsuperuser --noinput || true) &&
      (python manage.py import_book content/qd6/book.json --user "$DJANGO_SUPERUSER_USERNAME" || echo "OGOHLANTIRISH: qd6 import muvaffaqiyatsiz") &&
      (python manage.py import_book content/turk_a1/book.json --user "$DJANGO_SUPERUSER_USERNAME" || echo "OGOHLANTIRISH: turk_a1 import muvaffaqiyatsiz") &&
      (python manage.py import_book content/turk_a2/book.json --user "$DJANGO_SUPERUSER_USERNAME" || echo "OGOHLANTIRISH: turk_a2 import muvaffaqiyatsiz") &&
      (python manage.py import_book content/ai/book.json --user "$DJANGO_SUPERUSER_USERNAME" || echo "OGOHLANTIRISH: ai import muvaffaqiyatsiz")
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: muallim-api-wvzi.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://muallim-one.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://muallim-one.vercel.app
      - key: FRONTEND_URL
        value: https://muallim-one.vercel.app
      # Birinchi deployda admin hisobini avtomatik yaratadi (Render Dashboard > Environment'da
      # o'rnatilgan, qiymati git'ga tushmasin deb bu yerda sync: false qilingan).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Haqiqiy email yuborish uchun (parolni tiklash, streak eslatmalari) - EMAIL_HOST/USER/PASSWORD
      # Render Dashboard > Environment'da to'ldirilishi kerak (masalan Gmail App Password yoki
      # Resend/Mailgun/Brevo SMTP ma'lumotlari). Bo'sh qoldirilsa, email jim yuborilmaydi (xato bermaydi).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Production'da kutilmagan 500 xato chiqsa, shu odamlarga avtomatik email boradi (yuqoridagi
      # EMAIL_* orqali - sozlanmagan bo'lsa jim o'tkazib yuboriladi). Format:
      # "Ism:email@masalan.com,Ism2:ikkinchi@masalan.com"
      - key: ADMINS
        sync: false
      # Tashqi bepul kron xizmati (masalan cron-job.org) orqali muntazam
      # /api/history/backup/ (zaxira) va /api/history/cron/streak-reminders/ (kunlik eslatma
      # email) dan foydalanish uchun maxfiy token (X-Ops-Token header bilan birga yuboriladi).
      # Render Dashboard > Environment'da o'zingiz tasodifiy uzun qator qo'yasiz. Bo'sh
      # qoldirilsa, ikkala endpoint ham butunlay o'chirilgan (404) bo'ladi.
      - key: OPS_TOKEN
        sync: false
      # Oylik AI (Gemini/Claude) chaqiruvlar soni uchun umumiy chegara - foydalanuvchi boshiga
      # soatlik chegaradan (AI_RATE_LIMIT) tashqari, butun tizim uchun xarajatni nazorat qilish
      # uchun qo'shimcha himoya. 0 yoki bo'sh = cheksiz.
      - key: AI_MONTHLY_CALL_LIMIT
        value: "300"
      # Render'ning o'zining bepul PostgreSQL'i 30 kun harakatsizlikdan keyin ishlamay qoladi va
      # yana 14 kundan so'ng BUTUNLAY (qaytarib bo'lmas holda) o'chiriladi - shu sababli baza
      # Supabase'ga (bepul, muddatsiz, faqat "uxlaydi" - o'chirilmaydi) ko'chirildi. Quyidagi
      # Session Pooler manzili ishlatiladi (Render doimiy server, IPv4 orqali ulanadi - Transaction
      # Pooler emas, aynan Session Pooler tavsiya etiladi). Pastdagi eski `databases:` bo'limi
      # (muallim-db) endi ishlatilmaydi - tekshirib ko'rgach Render Dashboard'dan o'chirsangiz bo'ladi.
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.zbwoaoebgbbwgmpzboda
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: aws-0-ap-northeast-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      # Oylik obuna narxi (so'mda) - barcha fanlarning barcha bo'limlariga kirish uchun (har
      # fanning birinchi bo'limi hamma uchun bepul).
      - key: SUBSCRIPTION_PRICE
        value: "15000"
      # Payme (https://business.payme.uz) - "Kassalar" bo'limidan olinadi. Sozlanmaguncha
      # to'lov tugmasi frontendda ko'rinmaydi.
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_SECRET_KEY
        sync: false
      # Haqiqiy (production) to'lovlarga tayyor bo'lgach "0" qiling - aks holda test.paycom.uz
      # (sinov) muhitiga yo'naltiradi.
      - key: PAYME_TEST_MODE
        value: "1"
      # Click (https://merchant.click.uz) - "Xizmatlar" bo'limidan olinadi.
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
