databases:
  - name: muallim-db
    plan: free
    databaseName: muallim
    user: muallim

services:
  - type: web
    name: muallim-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Render bergan haqiqiy manzilni shu yerga yozing (masalan: muallim-api-xxxx.onrender.com):
      - key: ALLOWED_HOSTS
        value: muallim-api.onrender.com
      # Vercel'dagi frontend manzilingizni shu yerga yozing:
      - key: CORS_ALLOWED_ORIGINS
        value: https://muallim.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://muallim.vercel.app
      - key: FRONTEND_URL
        value: https://muallim.vercel.app
      - key: DB_NAME
        fromDatabase:
          name: muallim-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: muallim-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: muallim-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: muallim-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: muallim-db
          property: port
